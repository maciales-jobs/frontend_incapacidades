<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento - Gestión de Incapacidades</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/seguimiento.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 Seguimiento de Incapacidades</h1>
                <a href="dashboard.html">← Volver al Dashboard</a>
            </div>
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo Seguimiento</button>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <div class="search-box">
    <input type="number" id="buscarIncapacidad" placeholder="Buscar por incapacidad ID...">
    <select id="buscarEstado">
        <option value="">Todos los estados</option>
        <option value="registrada">Registrada</option>
        <option value="en_revision">En revisión</option>
        <option value="aprobada">Aprobada</option>
        <option value="rechazada">Rechazada</option>
        <option value="finalizada">Finalizada</option>
    </select>
    <button class="btn btn-primary" onclick="buscarSeguimientos()">Buscar</button>
    <button class="btn btn-success" onclick="cargarSeguimientos()">🔄 Actualizar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Incapacidad</th>
                    <th>Fecha</th>
                    <th>Comentario</th>
                    <th>Estado</th>
                    <th>Usuario Responsable</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaSeguimientos">
            </tbody>
        </table>
    </div>

    <!-- Modal para crear/editar -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Nuevo Seguimiento</h2>
            <form id="formSeguimiento">
                <input type="hidden" id="seguimientoId">
                
                <div class="form-group">
                    <label>Incapacidad ID:</label>
                    <input type="number" id="incapacidad_id" required>
                </div>
                
                <div class="form-group">
                    <label>Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>
                
                <div class="form-group">
                    <label>Comentario:</label>
                    <textarea id="comentario" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Estado:</label>
                    <select id="estado" required>
                        <option value="registrada">Registrada</option>
                        <option value="en_revision">En revisión</option>
                        <option value="aprobada">Aprobada</option>
                        <option value="rechazada">Rechazada</option>
                        <option value="finalizada">Finalizada</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Usuario Responsable:</label>
                    <input type="text" id="usuario_responsable" required>
                </div>
                
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="cerrarModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/seguimiento.js"></script>
</body>
</html>
