<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Gestión de Incapacidades</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/empleados.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>👥 Gestión de Empleados</h1>
                <a href="dashboard.html">← Volver al Dashboard</a>
            </div>
            <button class="btn btn-primary" onclick="mostrarFormulario()">+ Nuevo Empleado</button>
        </div>

        <div id="mensaje" class="mensaje"></div>

        <div class="search-box">
    <input type="text" id="buscarDocumento" placeholder="Buscar por documento...">
    <input type="text" id="buscarArea" placeholder="Buscar por área...">
    <select id="buscarEstado">
        <option value="">Todos los estados</option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
    </select>
    <button class="btn btn-primary" onclick="buscarEmpleados()">Buscar</button>
    <button class="btn btn-success" onclick="cargarEmpleados()">🔄 Actualizar</button>
</div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Documento</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Cargo</th>
                    <th>Área</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaEmpleados">
            </tbody>
        </table>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">Nuevo Empleado</h2>
            <form id="formEmpleado">
                <input type="hidden" id="empleadoId">
                
                <div class="form-group">
                    <label>Nombres:</label>
                    <input type="text" id="nombres" required>
                </div>
                
                <div class="form-group">
                    <label>Apellidos:</label>
                    <input type="text" id="apellidos" required>
                </div>
                
                <div class="form-group">
                    <label>Documento:</label>
                    <input type="text" id="documento" required>
                </div>
                
                <div class="form-group">
                    <label>Correo:</label>
                    <input type="email" id="correo" required>
                </div>
                
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="text" id="telefono" required>
                </div>
                
                <div class="form-group">
                    <label>Cargo:</label>
                    <input type="text" id="cargo" required>
                </div>
                
                <div class="form-group">
                    <label>Área:</label>
                    <input type="text" id="area" required>
                </div>
                
                <div class="form-group">
                    <label>Fecha de Ingreso:</label>
                    <input type="date" id="fecha_ingreso" required>
                </div>
                
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" class="btn btn-danger" onclick="cerrarModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/empleados.js"></script>
</body>
</html>
